<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#FFF9F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit İkili">
<meta name="description" content="İki kişilik diyet, adım, su ve hareket takibi">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Fit İkili</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#FFF9F4; --bg2:#FFFFFF; --bg3:#FDF0E7; --ink:#2A1C16; --ink2:#8B7468;
  --line:#F0DFD2; --acc:#F2603C; --acc2:#F2A93B; --acc-soft:#FFE7DE;
  --good:#1F9D6B; --warn:#D98A1F; --bad:#D8455C; --track:#F3E3D7; --aqua:#2BA4D6;
  --shadow:0 1px 2px rgba(80,40,20,.05),0 8px 24px -12px rgba(80,40,20,.18); --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-t]){
  --bg:#131020; --bg2:#1C1830; --bg3:#241F3C; --ink:#F3F0FF; --ink2:#9A92B8;
  --line:#2E2848; --acc:#8F7BFF; --acc2:#FF7EC7; --acc-soft:#282046;
  --good:#3DD69C; --warn:#F2B950; --bad:#FF6B86; --track:#2A2444; --aqua:#54C6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);}}
:root[data-theme="dark"]:not([data-t]){
  --bg:#131020; --bg2:#1C1830; --bg3:#241F3C; --ink:#F3F0FF; --ink2:#9A92B8;
  --line:#2E2848; --acc:#8F7BFF; --acc2:#FF7EC7; --acc-soft:#282046;
  --good:#3DD69C; --warn:#F2B950; --bad:#FF6B86; --track:#2A2444; --aqua:#54C6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);}
:root[data-t="sunrise"]{
  --bg:#FFF9F4; --bg2:#FFFFFF; --bg3:#FDF0E7; --ink:#2A1C16; --ink2:#8B7468;
  --line:#F0DFD2; --acc:#F2603C; --acc2:#F2A93B; --acc-soft:#FFE7DE;
  --good:#1F9D6B; --warn:#D98A1F; --bad:#D8455C; --track:#F3E3D7; --aqua:#2BA4D6;
  --shadow:0 1px 2px rgba(80,40,20,.05),0 8px 24px -12px rgba(80,40,20,.18);}
:root[data-t="lila"]{
  --bg:#F8F5FF; --bg2:#FFFFFF; --bg3:#F0EAFF; --ink:#231A38; --ink2:#7E6FA0;
  --line:#E6DCFB; --acc:#7C4DFF; --acc2:#C77DFF; --acc-soft:#EDE4FF;
  --good:#1F9D6B; --warn:#C98A1F; --bad:#D8455C; --track:#EAE1FC; --aqua:#4B8EE8;
  --shadow:0 1px 2px rgba(50,20,110,.05),0 8px 24px -12px rgba(50,20,110,.25);}
:root[data-t="galaxy"]{
  --bg:#120E24; --bg2:#1B1636; --bg3:#241D47; --ink:#F1ECFF; --ink2:#9C90C7;
  --line:#2F2757; --acc:#B388FF; --acc2:#FF6FD8; --acc-soft:#271F4E;
  --good:#42DDA4; --warn:#F5BE55; --bad:#FF6E8A; --track:#2A2352; --aqua:#5CC9F5;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.75);}
:root[data-t="mint"]{
  --bg:#F3F8F5; --bg2:#FFFFFF; --bg3:#E7F2EC; --ink:#0F2019; --ink2:#6C8478;
  --line:#DCEAE2; --acc:#0E9B76; --acc2:#3FA9D9; --acc-soft:#DBF1E9;
  --good:#0E9B76; --warn:#C9881A; --bad:#CE4257; --track:#DEEDE6; --aqua:#2F8FC4;
  --shadow:0 1px 2px rgba(10,50,35,.05),0 8px 24px -12px rgba(10,50,35,.2);}
:root[data-t="berry"]{
  --bg:#FFF5F9; --bg2:#FFFFFF; --bg3:#FCE9F1; --ink:#2B1220; --ink2:#906A7E;
  --line:#F5DCE7; --acc:#D62F7E; --acc2:#8A5CF0; --acc-soft:#FCDEEB;
  --good:#1F9D6B; --warn:#D98A1F; --bad:#D8455C; --track:#F6DEE9; --aqua:#3E9AD0;
  --shadow:0 1px 2px rgba(90,20,55,.05),0 8px 24px -12px rgba(90,20,55,.2);}
:root[data-t="midnight"]{
  --bg:#131020; --bg2:#1C1830; --bg3:#241F3C; --ink:#F3F0FF; --ink2:#9A92B8;
  --line:#2E2848; --acc:#8F7BFF; --acc2:#FF7EC7; --acc-soft:#282046;
  --good:#3DD69C; --warn:#F2B950; --bad:#FF6B86; --track:#2A2444; --aqua:#54C6F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);}
:root[data-t="carbon"]{
  --bg:#0E1113; --bg2:#161B1E; --bg3:#1D2429; --ink:#E9F2F3; --ink2:#8A9AA0;
  --line:#252E33; --acc:#2FD69B; --acc2:#4FB8E8; --acc-soft:#16302A;
  --good:#2FD69B; --warn:#E7B44C; --bad:#F46D7E; --track:#222B30; --aqua:#4FB8E8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.8);}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
#shell{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:0 16px calc(90px + env(safe-area-inset-bottom,0px));position:relative}

.topbar{display:flex;align-items:center;gap:8px;padding-block:14px 8px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 72%,transparent)}
.who{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--shadow);min-width:0}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.who b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.who small{display:block;font-size:10.5px;color:var(--ink2);line-height:1.15;font-weight:600}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);
  border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;
  transition:transform .15s}
.pill:active{transform:scale(.93)}
.pill.xp{color:var(--acc)}
.flame{font-size:15px;display:inline-block}
.flame.on{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(4deg)}}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.hl{border-color:var(--acc);background:linear-gradient(150deg,var(--acc-soft),var(--bg2) 62%)}
.card.aq{border-color:color-mix(in srgb,var(--aqua) 45%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--aqua) 12%,var(--bg2)),var(--bg2) 66%)}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin:0}
.tab{display:flex;flex-direction:column;gap:14px;animation:tabIn .34s cubic-bezier(.22,1,.36,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.motiv{font-size:13.5px;line-height:1.5;font-weight:600;margin:0}

.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ringwrap{position:relative;width:132px;height:132px;flex:0 0 auto}
.ringwrap svg{width:132px;height:132px;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-linecap:round}
.ringwrap .tr{stroke:var(--track);stroke-width:12}
.ringwrap .fg{stroke:var(--acc);stroke-width:12;transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1),stroke .3s}
.ringmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:1px}
.ringmid .big{font-family:"Bricolage Grotesque",sans-serif;font-size:31px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ringmid .lil{font-size:10.5px;color:var(--ink2);font-weight:600}
.minis{display:flex;flex-direction:column;gap:11px;min-width:0}
.mini{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center}
.mini .ic{font-size:18px;text-align:center}
.mini .lbl{font-size:11px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
.bar i.b2{background:var(--aqua)} .bar i.b3{background:var(--acc2)} .bar i.bg-good{background:var(--good)}
.mini .v{font-size:12.5px;font-weight:800;white-space:nowrap}

.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:var(--bg3);border-radius:13px;padding:10px 6px;text-align:center}
.macro .e{font-size:16px} .macro .n{font-size:14px;font-weight:800;margin-top:2px}
.macro .l{font-size:9.5px;color:var(--ink2);font-weight:700;letter-spacing:.03em}
.macro.over{background:color-mix(in srgb,var(--warn) 16%,var(--bg3))} .macro.over .n{color:var(--warn)}

.bal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.balrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.balrow b{color:var(--ink);font-weight:800;font-size:14px} .balrow small{font-size:10.5px;font-weight:600}
.deficit-bar{position:relative;height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.deficit-bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--good);width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
.deficit-bar .tick{position:absolute;top:-3px;bottom:-3px;width:2.5px;border-radius:2px;background:var(--ink);opacity:.55}

.mis{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.mis:first-of-type{border-top:none}
.mis .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;color:#fff;transition:.35s cubic-bezier(.34,1.56,.64,1)}
.mis.done .box{background:var(--good);border-color:var(--good);transform:scale(1.08)}
.mis .tx{font-size:13.5px;font-weight:600;flex:1}
.mis.done .tx{color:var(--ink2)}
.mis .xp{font-size:10.5px;font-weight:800;color:var(--acc)} .mis.done .xp{color:var(--good)}

.duel{display:flex;flex-direction:column;gap:13px}
.duelrow{display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:center}
.duelrow .av{width:38px;height:38px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-size:19px}
.duelrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.duelrow .nm{font-size:13px;font-weight:800}
.duelrow .st{font-size:11px;color:var(--ink2);font-weight:600}
.race{position:relative;height:40px;border-radius:12px;background:var(--bg3);overflow:hidden}
.race .lane{position:absolute;left:0;right:0;height:20px;display:flex;align-items:center}
.race .lane .runner{position:absolute;font-size:17px;transition:left 1.1s cubic-bezier(.22,1,.36,1);transform:translateX(-50%)}
.race .lane .trk{position:absolute;left:8px;right:8px;height:3px;border-radius:9px;background:var(--track)}
.race .lane .fill{position:absolute;left:8px;height:3px;border-radius:9px;background:var(--acc);width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.race .lane .fill.b2{background:var(--acc2)}
.race .flag{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}
.lvl{display:flex;align-items:center;gap:9px}
.lvl .badge{width:40px;height:40px;border-radius:13px;background:var(--acc-soft);display:grid;place-items:center;font-size:20px}
.lvl .info{flex:1;min-width:0}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px}
.bg{background:var(--bg3);border:1.5px dashed var(--line);border-radius:14px;padding:11px 6px;text-align:center;transition:.25s;opacity:.6}
.bg .e{font-size:23px;display:block;filter:grayscale(1)}
.bg .n{font-size:9.5px;font-weight:700;margin-top:5px;line-height:1.25;color:var(--ink2)}
.bg.got{background:var(--acc-soft);border:1.5px solid var(--acc);opacity:1;box-shadow:0 4px 14px -8px var(--acc)}
.bg.got .e{filter:none;animation:bpop .6s cubic-bezier(.34,1.56,.64,1)}
.bg.got .n{color:var(--ink)}
@keyframes bpop{0%{transform:scale(.4) rotate(-25deg)}60%{transform:scale(1.16) rotate(8deg)}100%{transform:none}}

/* egzersiz */
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;background:var(--bg3);
  border-radius:14px;padding:11px 12px;text-align:left;width:100%;transition:transform .15s}
.ex:active{transform:scale(.98)}
.ex .e{font-size:21px;text-align:center}
.ex .n{display:block;font-size:13px;font-weight:700} .ex .d{display:block;font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:2px;line-height:1.4}
.ex .burn{text-align:right} .ex .burn b{font-size:14px;font-weight:800;color:var(--acc);display:block}
.ex .burn span{font-size:9.5px;color:var(--ink2);font-weight:700}
.exdone{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;font-weight:600}
.exdone .del{margin:0 -10px 0 4px;display:inline-grid;vertical-align:middle}
.fav{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1.5px solid var(--line);
  border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:700;transition:transform .15s}
.fav:active{transform:scale(.94)} .fav .k{color:var(--ink2);font-weight:800;font-size:11px}
.sleepq{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.sleepq button{background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;padding:11px 4px;
  font-size:13px;font-weight:800;transition:.2s}
.sleepq button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.coach{font-size:13.5px;line-height:1.62;white-space:pre-wrap}
.coach b{display:block;margin-top:12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.coach b:first-child{margin-top:0}
.spin{width:17px;height:17px;border:2.5px solid var(--track);border-top-color:var(--acc);border-radius:50%;
  display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.dish{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;background:var(--bg3);
  border-radius:14px;padding:12px;text-align:left;width:100%;transition:transform .15s}
.dish:active{transform:scale(.98)}
.dish .e{font-size:22px;text-align:center}
.dish .n{display:block;font-size:13.5px;font-weight:800;line-height:1.3} .dish .d{display:block;font-size:11px;color:var(--ink2);font-weight:600;margin-top:4px;line-height:1.45}
.dish .k{text-align:right} .dish .k b{display:block;font-size:15px;color:var(--acc)} .dish .k span{font-size:9.5px;color:var(--ink2);font-weight:700}
.betchip{border:1.5px dashed var(--line);background:transparent;border-radius:11px;padding:7px 11px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.trophy{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--bg3);border-radius:15px;padding:13px}
.trophy .t{font-size:30px}
.shot{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;width:100%;text-align:left;
  background:linear-gradient(135deg,var(--acc-soft),var(--bg3));border:1.5px solid color-mix(in srgb,var(--acc) 35%,var(--line));
  border-radius:16px;padding:14px 15px;transition:transform .15s}
.shot:active{transform:scale(.98)}
.shot .e{font-size:28px}
.shot .n{display:block;font-size:14px;font-weight:800}
.shot .d{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:3px;line-height:1.4}
.pitem{display:grid;grid-template-columns:26px auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:none}
.pitem .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;
  font-size:13px;color:#fff;transition:.25s}
.pitem.on .chk{background:var(--good);border-color:var(--good)}
.pitem .n{display:block;font-size:13px;font-weight:700;line-height:1.3} .pitem .d{display:block;font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:3px;line-height:1.4}
.pitem .k{font-size:13px;font-weight:800;white-space:nowrap}
.pitem.off{opacity:.42}
.conf{display:inline-block;font-size:10px;font-weight:800;border-radius:7px;padding:2px 7px;margin-left:6px}
/* antrenman */
.progcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--bg3);
  border-radius:16px;padding:14px 13px;text-align:left;width:100%;transition:transform .15s}
.progcard:active{transform:scale(.98)}
.progcard .e{font-size:26px;text-align:center}
.progcard .n{display:block;font-size:14px;font-weight:800}
.progcard .d{display:block;font-size:11px;color:var(--ink2);font-weight:600;margin-top:3px}
.progcard .meta{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:800;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:2px 6px;color:var(--ink2)}
.tag.k{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.progcard .go{width:34px;height:34px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px}
.exdetail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.exdetail ol{margin:0;padding-left:17px;font-size:12.5px;line-height:1.65}
.exdetail li{margin-bottom:3px}
.exdetail .tip{margin-top:9px;font-size:11.5px;font-weight:700;background:var(--acc-soft);border-radius:10px;padding:9px 11px;line-height:1.5}
#train{position:fixed;inset:0;z-index:95;background:var(--bg);display:none;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px))}
#train.on{display:flex}
#train.rest{background:color-mix(in srgb,var(--aqua) 14%,var(--bg))}
.tr-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tr-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.tr-emoji{font-size:74px;line-height:1;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.04)}}
.tr-name{font-family:"Bricolage Grotesque",sans-serif;font-size:27px;font-weight:800;letter-spacing:-.02em}
.tr-sub{font-size:13px;color:var(--ink2);font-weight:700;max-width:320px;line-height:1.5;min-height:40px;transition:opacity .2s}
.tr-count{font-family:"Bricolage Grotesque",sans-serif;font-size:78px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.tr-count.low{color:var(--acc)}
.tr-ring{width:100%;max-width:330px;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.tr-ring i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .95s linear}
.tr-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-next{font-size:12px;color:var(--ink2);font-weight:700}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.cat{background:var(--bg2);border:1px solid var(--line);border-radius:15px;padding:13px 6px;text-align:center;
  transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .18s,background .18s}
.cat:active{transform:scale(.94)}
.cat.sel{border-color:var(--acc);background:var(--acc-soft)}
.cat .e{font-size:23px;display:block}
.cat .n{font-size:10.5px;font-weight:700;margin-top:5px;line-height:1.25;display:block}
.foods{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto;padding-right:2px}
.food{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
  background:var(--bg3);border-radius:13px;padding:10px 11px;text-align:left;width:100%;transition:transform .15s}
.food:active{transform:scale(.98)}
.food .e{font-size:18px} .food .n{display:block;font-size:13px;font-weight:600;line-height:1.25}
.food .c{font-size:11.5px;color:var(--ink2);font-weight:800}
.food .add{width:26px;height:26px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;line-height:1}
.seg{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:12px}
.seg button{flex:1;padding:7px 3px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--ink2);transition:.2s;white-space:nowrap}
.seg button.on{background:var(--bg2);color:var(--ink);box-shadow:var(--shadow)}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px;font-size:11.5px;font-weight:800;color:var(--ink2)}
.logrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);animation:pop .38s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.logrow .n{font-size:13px;font-weight:600} .logrow .s{font-size:10.5px;color:var(--ink2);font-weight:600}
.logrow .c{font-size:13px;font-weight:800}
.del{color:var(--ink2);font-size:17px;width:40px;height:40px;margin:-8px -10px -8px 0;border-radius:12px;display:grid;place-items:center;line-height:1}
.del:active{background:var(--bg3)}
.logrow{cursor:pointer}
.logrow:active{background:var(--bg3);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:10px}
.empty{text-align:center;color:var(--ink2);font-size:13px;padding:20px 10px;line-height:1.6}

.glasses{display:grid;gap:7px}
.glass{width:100%;height:46px;border-radius:7px 7px 12px 12px;border:2px solid var(--line);background:var(--bg3);
  position:relative;overflow:hidden;font-size:15px;display:grid;place-items:end center;padding-bottom:3px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .25s}
.glass:active{transform:scale(.88)}
.glass.full{border-color:var(--aqua)}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:color-mix(in srgb,var(--aqua) 34%,transparent);transition:height .5s cubic-bezier(.22,1,.36,1)}
.glass.full i{height:100%}
.nudge{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--aqua) 13%,var(--bg2));
  border:1px solid color-mix(in srgb,var(--aqua) 32%,var(--line));border-radius:15px;padding:12px 14px;font-size:13px;font-weight:700;animation:tabIn .4s}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;font-weight:800;color:var(--ink2)}
.inp{background:var(--bg3);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-weight:600;width:100%}
.inp:focus{border-color:var(--acc);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--acc);color:#fff;border-radius:13px;padding:13px 18px;font-size:14.5px;font-weight:800;width:100%;
  transition:transform .15s;box-shadow:0 6px 16px -8px var(--acc)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg3);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:13px;width:auto;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--bg3);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:700;transition:.2s}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.avb{aspect-ratio:1;border:1.5px solid var(--line);background:var(--bg3);border-radius:13px;font-size:22px;
  display:grid;place-items:center;transition:.2s}
.avb.on{border-color:var(--acc);background:var(--acc-soft);transform:scale(1.06)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.th{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;transition:.2s}
.th.on{border-color:var(--acc)}
.th .dots{display:flex;gap:4px}
.th .dots span{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.25)}
.th .nm{font-size:11.5px;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:none}
.switch .tx{font-size:13px;font-weight:700}
.switch .sub{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:2px}
.tg{width:48px;height:28px;border-radius:99px;background:var(--track);position:relative;flex:0 0 auto;transition:background .25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tg.on{background:var(--good)} .tg.on::after{transform:translateX(20px)}

.chart{width:100%;height:150px;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink2);font-size:9.5px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif}
.chart .barm{fill:var(--acc);transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .75s cubic-bezier(.22,1,.36,1)}
.chart.in .barm{transform:scaleY(1)}
.chart .barm.dim{fill:var(--track)}
.chart .lin{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.15s ease-out}
.chart.in .lin{stroke-dashoffset:0}
.chart .pt{fill:var(--acc);stroke:var(--bg2);stroke-width:2;opacity:0;transition:opacity .4s}
.chart.in .pt{opacity:1}
.chart .goal{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:3 4;opacity:.65}
.chart .glbl{fill:var(--ink2);font-size:9px;font-weight:800}

.trends{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trend{background:var(--bg3);border-radius:14px;padding:12px}
.trend .l{font-size:10px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.trend .v{font-size:19px;font-weight:800;margin-top:3px;line-height:1.1}
.trend .d{font-size:11px;font-weight:800;margin-top:3px}
.up{color:var(--good)} .dn{color:var(--warn)} .flat{color:var(--ink2)}

.bmibar{height:12px;border-radius:99px;display:flex;overflow:hidden;gap:2px}
.bmibar span{display:block}
.bmimark{position:relative;height:16px;margin-top:5px}
.bmimark i{position:absolute;top:0;transform:translateX(-50%);font-size:15px;transition:left 1s cubic-bezier(.22,1,.36,1)}
.bmiscale{position:relative;height:15px;font-size:10px;color:var(--ink2);font-weight:700}
.bmiscale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.bmiscale span:first-child{transform:none} .bmiscale span:last-child{transform:translateX(-100%)}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(492px,calc(100% - 32px));display:grid;grid-template-columns:repeat(5,1fr);gap:1px;z-index:30;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--shadow)}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 1px 7px;border-radius:13px;font-size:9.5px;font-weight:800;color:var(--ink2);transition:.22s;letter-spacing:-.01em}
.tb .e{font-size:20px;line-height:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1);filter:grayscale(.55) opacity(.75)}
.tb.on .e{filter:none}
.tb.on{background:var(--acc-soft);color:var(--acc)} .tb.on .e{transform:translateY(-2px) scale(1.14)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(10,6,20,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:80;opacity:0;transition:opacity .28s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:min(520px,100%);max-height:88vh;overflow-y:auto;
  background:var(--bg);border-radius:24px 24px 0 0;z-index:81;transition:transform .38s cubic-bezier(.22,1,.36,1);
  padding:8px 16px calc(26px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.28)}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 14px}
#sheetClose{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--bg3);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--ink2);z-index:3;margin-left:10px}
#sheetBottom{margin-top:16px}
#sheet h3{font-size:19px;margin-bottom:4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.srow:first-of-type{border-top:none}
.srow b{font-weight:800}
.lvlrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.lvlrow.now{color:var(--acc);font-weight:800}
.lvlrow .e{font-size:19px;text-align:center}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#wave{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;transition:opacity .35s}
#wave.on{opacity:1}
#waveTxt{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.82);z-index:56;pointer-events:none;
  text-align:center;opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.34,1.56,.64,1);
  background:rgba(6,58,88,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding:22px 30px;border-radius:26px;max-width:calc(100% - 48px)}
#waveTxt.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#waveTxt .big{font-family:"Bricolage Grotesque",sans-serif;font-size:54px;font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(0,40,70,.45);line-height:1}
#waveTxt .sub{font-size:15px;font-weight:800;color:#fff;margin-top:8px;text-shadow:0 2px 14px rgba(0,40,70,.5)}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:14px;font-size:13px;font-weight:700;
  z-index:90;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100% - 40px);text-align:center;
  display:flex;align-items:center;gap:12px}
#toast.act{pointer-events:auto;padding-right:8px}
#toastUndo{display:none;background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;white-space:nowrap}
#toast.act #toastUndo{display:inline-block}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet.on ~ #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px)}
#sheet.on ~ #toast.on{transform:translate(-50%,0)}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.55;margin:0}
.steps-guide{counter-reset:s;display:flex;flex-direction:column;gap:11px;margin:0;padding:0}
.steps-guide li{list-style:none;display:grid;grid-template-columns:23px 1fr;gap:10px;font-size:12.5px;line-height:1.5}
.steps-guide li::before{counter-increment:s;content:counter(s);width:23px;height:23px;border-radius:8px;
  background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:11px;font-weight:800}
.steps-guide code{background:var(--bg3);padding:1px 5px;border-radius:5px;font-size:11px;word-break:break-all}
details>summary{cursor:pointer;font-size:13px;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:var(--ink2);transition:.2s}
details[open]>summary::after{transform:rotate(180deg)}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:32px 0}
/* anlık ödül animasyonları */
.mis.justdone .box{animation:popIn .55s cubic-bezier(.34,1.56,.64,1)}
.mis.justdone .tx{animation:strike .5s ease-out}
@keyframes popIn{0%{transform:scale(.5) rotate(-20deg)}60%{transform:scale(1.3) rotate(6deg)}100%{transform:scale(1.08) rotate(0)}}
@keyframes strike{0%{color:var(--ink)}100%{color:var(--ink2)}}
.xpfloat{position:fixed;z-index:75;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--acc);font-size:17px;
  pointer-events:none;text-shadow:0 2px 10px var(--bg);animation:xpUp 1.15s cubic-bezier(.22,1,.36,1) forwards}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-54px) scale(1)}}
.pill.pop{animation:pillPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pillPop{45%{transform:scale(1.22)}}
.bump{animation:bump .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.16)}}
.race .runner{animation:runbob .9s ease-in-out infinite}
@keyframes runbob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.race .runner.lead{animation-duration:.55s}
.lvlup{text-align:center;padding:14px 0 6px}
.lvlup .big{font-size:78px;line-height:1;display:inline-block;animation:lvlSpin 1.1s cubic-bezier(.34,1.56,.64,1)}
@keyframes lvlSpin{0%{transform:scale(.2) rotate(-180deg);opacity:0}70%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.lvlup .ray{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--acc2) 35%,transparent),transparent 60%);pointer-events:none;animation:rayIn 1.2s ease-out}
@keyframes rayIn{from{opacity:0}to{opacity:1}}
.glass.full.justfull{animation:glassPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes glassPop{40%{transform:scale(1.18) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="shell">
  <div id="boot" class="onb"><div style="text-align:center">
    <div style="font-size:52px">🦁💪</div><h1 style="font-size:30px;margin-top:8px">Fit İkili</h1>
    <p class="hint" style="margin-top:6px">Yükleniyor…</p></div></div>
  <div id="onboard" class="onb" hidden></div>
  <div id="app" hidden>
    <div class="topbar">
      <button class="who" id="whoBtn"><span class="av" id="whoAv">🦁</span>
        <span style="text-align:left;min-width:0"><b id="whoName">—</b><small id="whoSub">—</small></span></button>
      <span class="spacer"></span>
      <button class="pill xp" id="xpBtn"><span>⚡</span><span class="num" id="xpN">0</span></button>
      <button class="pill" id="streakBtn"><span class="flame" id="flame">🔥</span><span class="num" id="streakN">0</span></button>
    </div>
    <section class="tab" id="t-home"></section>
    <section class="tab" id="t-food" hidden></section>
    <section class="tab" id="t-move" hidden></section>
    <section class="tab" id="t-prog" hidden></section>
    <section class="tab" id="t-set" hidden></section>
  </div>
  <nav class="tabbar" id="tabbar" hidden>
    <button class="tb on" data-tab="home"><span class="e">🏠</span>Bugün</button>
    <button class="tb" data-tab="food"><span class="e">🍽️</span>Yemek</button>
    <button class="tb" data-tab="move"><span class="e">🏋️</span>Hareket</button>
    <button class="tb" data-tab="prog"><span class="e">📈</span>İlerleme</button>
    <button class="tb" data-tab="set"><span class="e">⚙️</span>Ayarlar</button>
  </nav>
</div>
<div id="train">
  <div class="tr-top">
    <span class="tag" id="trRound">1 / 1</span>
    <span class="tr-next" id="trProg">—</span>
    <button class="btn ghost sm" id="trQuit">Bitir ✕</button>
  </div>
  <div class="tr-mid">
    <span class="tr-emoji" id="trEmoji">🤸</span>
    <span class="tr-name" id="trName">Hazırlan</span>
    <span class="tr-count" id="trCount">5</span>
    <span class="tr-ring"><i id="trBar"></i></span>
    <span class="tr-sub" id="trSub">Başlıyoruz…</span>
  </div>
  <div class="tr-btns">
    <button class="btn ghost" id="trPause">⏸ Duraklat</button>
    <button class="btn" id="trSkip">Geç ⏭</button>
  </div>
</div>
<input type="file" id="bkFile" accept="application/json,.json" hidden>
<canvas id="wave"></canvas>
<div id="waveTxt"><div class="big" id="waveBig">1/8</div><div class="sub" id="waveSub"></div></div>
<canvas id="fx"></canvas>
<div id="scrim"></div>
<div id="sheet"><div class="grab"></div><button id="sheetClose" aria-label="Kapat">✕</button><div id="sheetBody"></div>
  <button class="btn ghost" id="sheetBottom">Kapat</button></div>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Geri al</button></div>

<script>
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const TODAY=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const DAYN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const uid=()=>Math.random().toString(36).slice(2,9);
const nf=n=>Number(n).toLocaleString('tr-TR');
const REDUCED=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;

const CATS=[
 {id:'karb',e:'🍞',n:'Karbonhidrat',items:[

function catItems(id){
  if(id==='ozel')return (S.me&&S.me.custom)||[];
  const c=CATS.find(x=>x.id===id);return c?c.items:[];
}
function searchFoods(q){
  q=q.toLocaleLowerCase('tr').trim();if(q.length<2)return[];
  const out=[];
  ((S.me&&S.me.custom)||[]).forEach((f,i)=>{if(f.n.toLocaleLowerCase('tr').includes(q))out.push({cat:'ozel',i,f})});
  CATS.forEach(c=>c.items.forEach((f,i)=>{if(f.n.toLocaleLowerCase('tr').includes(q))out.push({cat:c.id,i,f})}));
  return out.slice(0,12);
}

const genCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<8;i++)c+=A[Math.floor(Math.random()*A.length)];return c};
/* Firestore'u artifact db arayüzüne benzeten ince katman: 'koleksiyon/belge' → homes/EV/koleksiyon/belge */
function mkDB(fs,code){
  const home=fs.collection('homes').doc(code);
  const ref=path=>{const [c,d]=path.split('/');return home.collection(c).doc(d)};
  const wrapSnap=s=>({id:s.id,exists:!!s.exists,data:()=>s.data()});
  const wrapQ=q=>({
    where:(f,op,v)=>wrapQ(q.where(f,op,v)),
    get:async()=>{const r=await q.get();return{docs:r.docs.map(wrapSnap)}},
    onSnapshot:(cb,err)=>q.onSnapshot(r=>cb({docs:r.docs.map(wrapSnap)}),err||(()=>{}))});
  return{
    doc:path=>({get:async()=>wrapSnap(await ref(path).get()),
      set:data=>ref(path).set(data),delete:()=>ref(path).delete(),
      onSnapshot:(cb,err)=>ref(path).onSnapshot(r=>cb(wrapSnap(r)),err||(()=>{}))}),
    collection:c=>wrapQ(home.collection(c))};
}

/* ===== hesap ===== */
function calc(p){
  if(!p)return{goal:2000,bmi:0,bmr:0,tdee:0,perWeek:0,diff:0,need:0};
  const h=p.height/100,w=p.weight,bmi=w/(h*h);
  const bmr=p.gender==='k'?(10*w+6.25*p.height-5*p.age-161):(10*w+6.25*p.height-5*p.age+5);
  const tdee=bmr*(p.act||1.375),diff=w-(p.target||w),days=Math.max(p.days||30,1);
  const sw=p.startWeight||w,tg=p.target||w;
  const reached=!!p.target&&((sw>=tg&&w<=tg)||(sw<tg&&w>=tg))&&Math.abs(sw-tg)>=0.5;
  const need=reached?0:(diff*7700)/days,floor=p.gender==='k'?1200:1500;
  const goal=Math.round(clamp(tdee-need,floor,tdee+1200));
  return {bmi,bmr,tdee,goal,need,reached,perWeek:reached?0:diff/(days/7),diff,aggressive:!reached&&Math.abs(diff/(days/7))>1,floored:(tdee-need)<floor};
}
/* adım + su hedefini sistem belirler */
function autoGoals(p){
  const g=calc(p),bmi=g.bmi;
  let step={1.2:7000,1.375:8500,1.55:10000,1.725:11000}[p.act]||8500;
  if((p.target||p.weight)<p.weight)step+=1000;
  if(bmi>=30)step=Math.min(step,8000);
  if(bmi>=35)step=Math.min(step,7000);
  if(bmi<18.5)step=Math.min(step,6000);
  if(p.age>=55)step=Math.round(step*0.9);
  step=Math.round(clamp(step,5000,14000)/500)*500;
  let ml=p.weight*24+(p.act>=1.725?600:p.act>=1.55?400:p.act>=1.375?200:0)+(step/1000)*50;
  const water=clamp(Math.round(ml/250),6,12);
  return{step,water,ml:water*250};
}
function goals(p){p=p||S.me;
  const a=autoGoals(p);
  return p.manualGoals?{step:p.stepGoal||a.step,water:p.waterGoal||a.water,ml:(p.waterGoal||a.water)*250,auto:false}:
    Object.assign({auto:true},a)}

function dayXp(p,d){return missions(p,d).filter(m=>m.ok).reduce((a,m)=>a+m.xp,0)}
function levelOf(xp){let i=0;for(let j=0;j<LEVELS.length;j++)if(xp>=LEVELS[j].x)i=j;
  const cur=LEVELS[i],nx=LEVELS[i+1];
  return{i,cur,nx,pct:nx?(xp-cur.x)/(nx.x-cur.x):1,need:nx?nx.x-xp:0}}

function weekXpRange(hist,day,from,to){

function touch(){
  if(!S.me||!S.day)return;
  const ms=missions(),done=ms.filter(m=>m.ok).length,nx=ms.filter(m=>m.ok).reduce((a,m)=>a+m.xp,0);
  const delta=nx-(S.day.xp||0);let ch=false;
  // hangi görevler yeni bitti?
  const nowDone={};ms.forEach(m=>{nowDone[m.id]=m.ok});
  const fresh=ms.filter(m=>m.ok&&!prevDone[m.id]&&Object.keys(prevDone).length);
  prevDone=nowDone;
  const lvBefore=levelOf(S.me.totalXp||0).i;
  if(delta!==0){S.day.xp=nx;S.me.totalXp=Math.max(0,(S.me.totalXp||0)+delta);ch=true}
  if(fresh.length){fxQueue=fresh.map(m=>m.id);chime('ping');buzz(14)}
  if(delta>0)setTimeout(()=>floatXp(delta),60);
  const lvAfter=levelOf(S.me.totalXp||0).i;
  if(lvAfter>lvBefore)setTimeout(()=>levelUpSheet(levelOf(S.me.totalXp||0)),500);

  const hist=[...S.hist.filter(h=>h.date!==TODAY()),d];
  const has=id=>p.badges.indexOf(id)>=0,got=[];
  const add=(id,c)=>{if(c&&!has(id)){p.badges.push(id);got.push(id)}};
  const st=streakInfo(p),totSteps=hist.reduce((a,h)=>a+(h.steps||0),0);
  const exN=hist.reduce((a,h)=>a+((h.ex||[]).length),0);
  const exK=hist.reduce((a,h)=>a+((h.ex||[]).reduce((b,x)=>b+x.kcal,0)),0);
  add('b10k',hist.some(h=>(h.steps||0)>=10000));
  add('seri7',st>=7);add('seri30',st>=30);
  add('su5',hist.filter(h=>(h.water||0)>=goals(p).water).length>=5);
  add('seker',hist.some(h=>{const t=totals(h);return t.n>=3&&t.s<15}));
  add('paket3',hist.filter(h=>{const t=totals(h);return t.n>=3&&t.p===0}).length>=3);
  add('perfect',hist.some(h=>missions(p,h).every(m=>m.ok)));
  add('kilo1',Math.abs((p.startWeight||p.weight)-p.weight)>=1);
  add('a100k',totSteps>=100000);add('xp1000',(p.totalXp||0)>=1000);
  add('ex10',exN>=10);add('ex500',exK>=500);
  if(got.length){const b=BADGES.find(x=>x.id===got[0]);
    setTimeout(()=>{party();chime('win');toast(b.e+' Yeni rozet: '+b.n+'!')},400)}
  return got.length>0;
}

let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function chime(kind){
  const c=ac();if(!c)return;const t=c.currentTime;
  const bloop=(f0,f1,at,dur,type,vol)=>{
    const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t+at);o.frequency.exponentialRampToValueAtTime(f1,t+at+dur);
    g.gain.setValueAtTime(0,t+at);g.gain.linearRampToValueAtTime(vol||.22,t+at+.012);
    g.gain.exponentialRampToValueAtTime(.0008,t+at+dur);
    o.connect(g);g.connect(c.destination);o.start(t+at);o.stop(t+at+dur+.05)};
  if(kind==='water'){ /* su damlası: aşağıdan yukarı kısa "plop" */
    bloop(420,1180,0,.16,'sine',.26);bloop(240,700,.09,.2,'sine',.14);
  }else if(kind==='win'){ /* zafer arpeji */
    [523,659,784,1046].forEach((f,i)=>bloop(f,f,i*.085,.22,'triangle',.16));
  }else{ /* nazik bildirim */
    bloop(880,880,0,.16,'triangle',.18);bloop(1174,1174,.14,.28,'triangle',.14);}
}

const fx=$('#fx'),fxc=fx.getContext('2d');let parts=[],raf=0;
function party(){
  if(REDUCED())return;
  fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;
  fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';
  fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cs=getComputedStyle(document.documentElement);
  const cols=[cs.getPropertyValue('--acc').trim(),cs.getPropertyValue('--acc2').trim(),cs.getPropertyValue('--good').trim()];
  for(let i=0;i<80;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*180,y:innerHeight*.4,
    vx:(Math.random()-.5)*10,vy:-Math.random()*14-3,r:Math.random()*5+3,c:cols[i%3],a:1,rot:Math.random()*6});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  fxc.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.a>0);
  parts.forEach(p=>{p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.rot+=.15;p.a-=.011;
    fxc.save();fxc.globalAlpha=Math.max(p.a,0);fxc.translate(p.x,p.y);fxc.rotate(p.rot);
    fxc.fillStyle=p.c;fxc.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);fxc.restore()});
  if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;fxc.clearRect(0,0,innerWidth,innerHeight)}
}
let tT=null,lastAdd=null;
function toast(m,undoIds){const e=$('#toast');$('#toastMsg').textContent=m;
  lastAdd=undoIds&&undoIds.length?{ids:undoIds}:null;e.classList.toggle('act',!!lastAdd);
  e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>{e.classList.remove('on');lastAdd=null},lastAdd?5000:2800)}
function undoAdd(){
  if(!lastAdd||!S.day)return;
  const ids=lastAdd.ids;lastAdd=null;
  S.day.items=(S.day.items||[]).filter(i=>ids.indexOf(i.id)<0);
  $('#toast').classList.remove('on','act');touch();
  setTimeout(()=>toast('↩️ Geri alındı'),150);
}

const wv=$('#wave'),wvc=wv.getContext('2d');let wAnim=null;
function waterSplash(glasses,goal){
  const frac=clamp(glasses/goal,0,1);
  const txt=$('#waveTxt');
  $('#waveBig').textContent=glasses+' / '+goal;
  $('#waveSub').textContent=glasses>=goal?'Günlük su hedefin tamam! 🏆':pick(MSG.wSplash,'w'+glasses);
  chime('water');
  if(REDUCED()){toast('💧 '+glasses+'/'+goal);return}
  if(wAnim)cancelAnimationFrame(wAnim);
  const W=innerWidth,H=innerHeight;
  wv.width=W*devicePixelRatio;wv.height=H*devicePixelRatio;
  wv.style.width=W+'px';wv.style.height=H+'px';
  wvc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  wv.classList.add('on');txt.classList.add('on');
  const bub=Array.from({length:26},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*7+2,sp:Math.random()*1.3+.5,ph:Math.random()*6}));
  const aqua=getComputedStyle(document.documentElement).getPropertyValue('--aqua').trim()||'#2BA4D6';
  const RISE=620,HOLD=900,FALL=560,TOT=RISE+HOLD+FALL,peak=.30+frac*.52,t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function draw(now){
    const t=now-t0;let lv;
    if(t<RISE)lv=peak*ease(t/RISE);else if(t<RISE+HOLD)lv=peak;else lv=peak*(1-ease(clamp((t-RISE-HOLD)/FALL,0,1)));
    const top=H*(1-lv);wvc.clearRect(0,0,W,H);
    [{a:.34,off:0,amp:15,len:.9,sp:.0022},{a:.55,off:9,amp:11,len:1.5,sp:.0031}].forEach(L=>{
      wvc.beginPath();wvc.moveTo(0,H);
      for(let x=0;x<=W;x+=6){
        const y=top+L.off+Math.sin(x*.011*L.len+t*L.sp)*L.amp*(t<RISE?ease(t/RISE):1)+Math.sin(x*.005+t*.0017)*6;
        wvc.lineTo(x,y)}
      wvc.lineTo(W,H);wvc.closePath();wvc.fillStyle=aqua;wvc.globalAlpha=L.a;wvc.fill()});
    wvc.globalAlpha=1;
    bub.forEach(b=>{b.y-=b.sp*1.9;if(b.y<top-30){b.y=H+20;b.x=Math.random()*W}
      if(b.y>top+6){const wob=Math.sin(t*.004+b.ph)*5;
        wvc.beginPath();wvc.arc(b.x+wob,b.y,b.r,0,7);wvc.fillStyle='rgba(255,255,255,.34)';wvc.fill()}});
    if(t<TOT)wAnim=requestAnimationFrame(draw);
    else{wv.classList.remove('on');txt.classList.remove('on');wAnim=null;setTimeout(()=>wvc.clearRect(0,0,W,H),400)}}
  wAnim=requestAnimationFrame(draw);
  if(glasses>=goal)setTimeout(()=>{party();chime('win')},RISE);
}

/* ===== grafikler ===== */
function barChart(rows,unit,goal){
  const W=320,H=150,pl=32,pr=8,pt=14,pb=22;
  const max=Math.max(goal||0,...rows.map(r=>r.v),1)*1.14;
  const iw=W-pl-pr,ih=H-pt-pb,bw=Math.min(28,iw/rows.length-6);
  let g='';
  for(let i=0;i<=2;i++){const y=pt+ih*(i/2),v=Math.round(max*(1-i/2));
    g+=`<line class="grid" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/><text class="axis" x="${pl-6}" y="${y+3}" text-anchor="end">${v>=1000?(v/1000).toFixed(1)+'k':v}</text>`}
  if(goal){const y=pt+ih*(1-goal/max);
    g+=`<line class="goal" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/><text class="glbl" x="${W-pr}" y="${y-4}" text-anchor="end">hedef</text>`}
  rows.forEach((r,i)=>{
    const cx=pl+iw*((i+.5)/rows.length),h=Math.max(r.v/max*ih,r.v>0?3:0),y=pt+ih-h;
    g+=`<rect class="barm${r.v?'':' dim'}" x="${(cx-bw/2).toFixed(1)}" y="${(r.v?y:pt+ih-3).toFixed(1)}" width="${bw.toFixed(1)}" height="${(r.v?h:3).toFixed(1)}" rx="4" style="transition-delay:${i*55}ms"><title>${esc(r.l)}: ${nf(r.v)} ${esc(unit)}</title></rect>`;
    if(rows.length<=10||i%Math.ceil(rows.length/7)===0)
      g+=`<text class="axis" x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(r.s)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} grafiği">${g}</svg>`}
function lineChart(rows,unit,extra){
  if(rows.length<2)return '<p class="empty">Trend çizgisi için en az 2 kilo kaydı gerekiyor.<br>İlkini şimdi girebilirsin ⚖️</p>';
  const W=320,H=150,pl=34,pr=12,pt=14,pb=22;
  const vs=rows.map(r=>r.v),mn=Math.min(...vs),mx=Math.max(...vs),pad=Math.max((mx-mn)*.28,.6);
  const lo=mn-pad,hi=mx+pad,iw=W-pl-pr,ih=H-pt-pb;
  const X=i=>pl+iw*(rows.length===1?.5:i/(rows.length-1)),Y=v=>pt+ih*(1-(v-lo)/(hi-lo));
  let g='',len=0;
  for(let i=0;i<=2;i++){const y=pt+ih*(i/2),v=(hi-(hi-lo)*(i/2));
    g+=`<line class="grid" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/><text class="axis" x="${pl-6}" y="${y+3}" text-anchor="end">${v.toFixed(1)}</text>`}
  if(extra!=null&&extra>=lo&&extra<=hi){const y=Y(extra);
    g+=`<line class="goal" x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}"/><text class="glbl" x="${W-pr}" y="${y-4}" text-anchor="end">hedef</text>`}
  for(let i=1;i<rows.length;i++)len+=Math.hypot(X(i)-X(i-1),Y(rows[i].v)-Y(rows[i-1].v));
  g+=`<path class="lin" style="--len:${len.toFixed(0)};stroke-dasharray:${len.toFixed(0)}" d="${rows.map((r,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(r.v).toFixed(1)).join(' ')}"/>`;
  rows.forEach((r,i)=>{g+=`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(r.v).toFixed(1)}" r="${i===rows.length-1?5:3.2}" style="transition-delay:${700+i*40}ms"><title>${esc(r.l)}: ${r.v} ${esc(unit)}</title></circle>`});
  [0,rows.length-1].forEach(i=>{g+=`<text class="axis" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i?'end':'start'}">${esc(rows[i].s)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo değişimi">${g}</svg>`}

function deficitMsg(net,needK,g,t){
  if(!t.n)return'Bugün henüz kayıt yok. Yemeklerini eklemeye başlayınca bu tablo canlanacak 🌱';
  if(g.reached)return net>=-150&&net<=400?'Koruma modundasın ve dengedesin 🏁 Tam da olması gereken bu.':net>400?'Koruma modunda biraz fazla açık var — hedefine ulaştın, artık yeterince beslenmek önemli 💛':'Koruma modunda hafif fazlan var; akşam kısa bir yürüyüş dengeyi getirir 🌙';
  if(needK<=0)return'Kilo alma hedefindesin: günde <b>'+nf(Math.abs(needK))+' kcal fazla</b> alman gerekiyor. Protein ve sağlıklı yağları unutma 💪';
  if(net>=needK*2.2)return'Açığın hedefinin çok üstünde. Hızlı gitmek cazip ama vücudun yeterli enerjiye ihtiyaç duyuyor — bugün biraz daha beslenmen daha iyi olur 💛';
  if(net>=needK)return'Hedef açığını yakaladın 🎯 Bu tempoyla haftada ~'+Math.abs(g.perWeek).toFixed(2)+' kg yolundasın. Harika!';
  if(net>0)return'Açıktasın ama hedefin <b>'+nf(needK)+' kcal</b>. Aradaki <b>'+nf(needK-net)+' kcal</b>\'yi kısa bir yürüyüş ya da 10 dk egzersizle kapatabilirsin 🚶';
  return'Bugün alım yakımın üstünde. Sorun değil — akşam 20 dakikalık bir yürüyüş dengeyi çevirir 🌙';
}

function renderProg(){
  const p=S.me,g=calc(p),bl=bmiLabel(g.bmi),hist=S.hist,gl=goals(p),N=S.range;
  const series=[];
  for(let i=N-1;i>=0;i--){
    const ds=addDays(TODAY(),-i);
    const rec=ds===TODAY()?S.day:hist.find(h=>h.date===ds);
    const tt=totals(rec),dow=new Date(ds+'T12:00:00').getDay();
    series.push({s:N<=7?DAYN[dow]:ds.slice(8),l:ds,kcal:tt.c,steps:(rec&&rec.steps)||0,
      water:(rec&&rec.water)||0,sugar:tt.s,sleep:(rec&&rec.sleep)||0,xp:(rec&&rec.xp)||0})}
  const mm=S.chartM;
  const key={kcal:'kcal','adım':'steps',su:'water',seker:'sugar',uyku:'sleep'}[mm];
  const unit={kcal:'kcal','adım':'adım',su:'bardak',seker:'g şeker',uyku:'saat'}[mm];
  const goalv={kcal:g.goal,'adım':gl.step,su:gl.water,seker:50,uyku:7.5}[mm];
  const rows=series.map(r=>({s:r.s,l:r.l,v:r[key]}));
  const wk=(from,to)=>{const a={steps:0,kcal:0,water:0,sugar:0,pak:0,xp:0,n:0};
    for(let i=from;i<to;i++){const ds=addDays(TODAY(),-i);
      const rec=ds===TODAY()?S.day:hist.find(h=>h.date===ds);if(!rec)continue;
      const tt=totals(rec);a.steps+=rec.steps||0;a.kcal+=tt.c;a.water+=rec.water||0;
      a.sugar+=tt.s;a.pak+=tt.p;a.xp+=rec.xp||0;if(tt.n)a.n++}
    return a};
  const cur=wk(0,7),prev=wk(7,14);
  const pctD=(a,b)=>b>0?Math.round((a-b)/b*100):(a>0?100:0);
  const trend=(label,val,delta,goodUp,suf)=>{
    const cls=delta===0?'flat':(goodUp?(delta>0?'up':'dn'):(delta<0?'up':'dn'));
    const arrow=delta===0?'→':(delta>0?'↑':'↓');
    return `<div class="trend"><div class="l">${label}</div><div class="v num">${val}${suf||''}</div>
      <div class="d ${cls}">${arrow} geçen haftaya göre %${Math.abs(delta)}</div></div>`};
  const wrows=[...hist,S.day].filter(h=>h&&h.weight).map(h=>({s:h.date.slice(8)+'.'+h.date.slice(5,7),l:h.date,v:h.weight}));
  let eta='';
  if(wrows.length>=2){
    const f=wrows[0],l=wrows[wrows.length-1];
    const dd=Math.max(1,(new Date(l.l)-new Date(f.l))/864e5),rate=(l.v-f.v)/dd,rem=(p.target||p.weight)-l.v;
    if(rate!==0&&Math.sign(rate)===Math.sign(rem)){
      const need=Math.round(rem/rate);
      if(need>0&&need<2000){const dt=new Date();dt.setDate(dt.getDate()+need);

    else eta='Son ölçümler hedefin tersine gidiyor. Panik yok: bir haftalık veri her şeyi anlatmaz, devam 💛'}
  const bmiPos=clamp((g.bmi-15)/25,0,1)*100;
  const done=(p.startWeight||p.weight)-p.weight,total=(p.startWeight||p.weight)-(p.target||p.weight);
  const prog=total!==0?clamp(done/total,0,1):0;
  const daysLeft=p.startDate?Math.max(0,(p.days||30)-Math.round((new Date(TODAY())-new Date(p.startDate))/864e5)):(p.days||30);

function coachTips(cur,prev){
  const p=S.me,gl=goals(p),g=calc(p),tips=[];
  const days=Math.max(cur.n,1);
  const src=S.hist.filter(h=>h&&h.date>=addDays(TODAY(),-6));
  const sleepDays=src.filter(h=>h.sleep>0),avgSleep=sleepDays.length?sleepDays.reduce((a,h)=>a+h.sleep,0)/sleepDays.length:0;
  const exDays=src.filter(h=>(h.ex||[]).length).length;
  if(cur.n>=2&&cur.water/days<gl.water*0.8)tips.push({e:'💧',t:'Su ortalaman günde '+Math.round(cur.water/days)+' bardak; hedef '+gl.water+'. Sabah kalkınca ve her öğünden önce birer bardak — üçü tek başına aradaki farkı kapatır.'});
  if(cur.steps/7<gl.step*0.7)tips.push({e:'👟',t:'Adım ortalaman '+nf(Math.round(cur.steps/7))+'. Akşam yemeğinden sonra 15 dakikalık yürüyüş yaklaşık 1.800 adım demek ve kan şekerini de dengeliyor.'});
  if(cur.n>=2&&cur.sugar/days>50)tips.push({e:'🍬',t:'Günlük şekerin ortalama '+Math.round(cur.sugar/days)+' g. En büyük kaynak genelde içecekler: kolayı ve meyve suyunu sadece hafta sonuna al.'});
  if(cur.n>=2&&cur.pak/days>1)tips.push({e:'🍫',t:'Günde ortalama '+(cur.pak/days).toFixed(1)+' paketli gıda. Evde göz önünde durmasın; yerine bir avuç kuruyemiş ve meyve.'});
  if(exDays<3)tips.push({e:'🏋️',t:exDays===0?'Bu hafta antrenman yok. 6 dakikalık "Uyanış" programı ile başla — sayılması için uzun olması gerekmiyor.':'Bu hafta '+exDays+' gün antrenman yaptın; haftada 3 güne çıkmak en büyük farkı yaratan eşik.'});
  if(sleepDays.length>=3&&avgSleep<7)tips.push({e:'😴',t:'Ortalama uykun '+avgSleep.toFixed(1)+' saat. 7 saatin altında iştah hormonları bozuluyor; yarım saat erken yatmak diyetten daha çok iş yapar.'});
  if(cur.n>=3&&cur.kcal/cur.n>g.goal*1.1)tips.push({e:'🎯',t:'Günlük kalorin hedefin %'+Math.round((cur.kcal/cur.n/g.goal-1)*100)+' üstünde. En kolay kazanç: akşam porsiyonunu "Bol" yerine "Normal" seç.'});
  if(cur.n<4)tips.push({e:'📝',t:'Bu hafta '+cur.n+' gün kayıt girdin. Öneriler ancak kayıt oldukça isabetli olur — favoriler ile 5 saniyeye iniyor.'});
  if(!tips.length)tips.push({e:'🏆',t:'Her şey yerinde: su, adım, şeker, antrenman ve uyku hedeflerin tamam. Bu hafta yaptığını gelecek hafta aynen tekrar et.'});
  return tips.slice(0,3);
}
function weeklyMsg(cur,prev,pctD){
  const w=[];
  if(cur.steps>prev.steps&&prev.steps>0)w.push(`geçen haftaya göre <b>%${pctD(cur.steps,prev.steps)} daha çok adım</b> attın`);
  if(cur.sugar<prev.sugar&&prev.sugar>0)w.push(`<b>%${Math.abs(pctD(cur.sugar,prev.sugar))} daha az şeker</b> aldın`);
  if(cur.water>prev.water&&prev.water>0)w.push(`<b>daha çok su</b> içtin`);
  if(cur.pak<prev.pak&&prev.pak>0)w.push(`<b>daha az paketli gıda</b> tükettin`);
  if(w.length)return'Bu hafta '+w.slice(0,2).join(' ve ')+'. Bu gerçekten kıymetli, tebrikler 🎉';
  if(cur.xp>0)return'Bu hafta '+nf(cur.xp)+' XP topladın. Veri birikince trendler daha da netleşecek — devam 💪';
  return'Veri biriktikçe buraya haftalık karşılaştırman gelecek. Birkaç gün kayıt yeterli 🌱';
}

function pad(n){return String(n).padStart(2,'0')}
function icsDate(d,h,m){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(h)+pad(m)+'00'}
function buildIcs(){
  const now=new Date(),stamp=icsDate(now,now.getHours(),now.getMinutes())+'Z';
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+(now.getHours()>=12?1:0));
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fit Ikili//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const ev=(h,m,rule,sum,desc)=>{

function countUp(el,to){

  const dur=800,t0=performance.now();
  (function s(n){const t=clamp((n-t0)/dur,0,1);
    el.textContent=nf(Math.round(to*(1-Math.pow(1-t,3))));if(t<1)requestAnimationFrame(s)})(t0)}

let TR=null,wakeLock=null;
async function keepAwake(on){
  try{ if(on){ if(!wakeLock&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen') }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null } }catch(e){ wakeLock=null }
}
function beep(kind){
  const c=ac();if(!c)return;const t=c.currentTime;
  const tone=(f,at,dur,vol)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';
    o.frequency.setValueAtTime(f,t+at);g.gain.setValueAtTime(0,t+at);
    g.gain.linearRampToValueAtTime(vol,t+at+.01);g.gain.exponentialRampToValueAtTime(.0008,t+at+dur);
    o.connect(g);g.connect(c.destination);o.start(t+at);o.stop(t+at+dur+.04)};
  if(kind==='tick')tone(880,0,.1,.16);
  else if(kind==='go'){tone(660,0,.14,.2);tone(990,.13,.3,.2)}
  else if(kind==='rest')tone(520,0,.28,.16);
}
function startProgram(id){
  const pr=PROG.find(x=>x.id===id);if(!pr)return;
  const kg=S.me.weight,q=[];
  for(let r=0;r<pr.rounds;r++)pr.steps.forEach(([xid,sec],i)=>{
    const x=EX.find(v=>v.id===xid);
    q.push({type:'work',x,sec,round:r+1,kcal:kcalMin(x.met,kg)*sec/60});
    const last=(r===pr.rounds-1&&i===pr.steps.length-1);
    if(!last)q.push({type:'rest',sec:pr.rest,round:r+1});
  });
  TR={pr,q,i:-1,left:5,phase:'prep',paused:false,kcal:0,sec:0,timer:null,cue:0};
  $('#train').classList.add('on');
  ac();keepAwake(true);
  trStep();
  TR.timer=setInterval(trTick,1000);
}
function trStep(){
  if(!TR)return;
  if(TR.phase==='prep'){
    $('#trEmoji').textContent='⏱';$('#trName').textContent='Hazırlan';
    $('#trSub').textContent=TR.q[0].x?('İlk hareket: '+TR.q[0].x.n):'';
    $('#trRound').textContent=TR.pr.e+' '+TR.pr.n;
    $('#train').classList.remove('rest');
    updProg();return;
  }
  TR.i++;
  if(TR.i>=TR.q.length)return trDone();
  const st=TR.q[TR.i];
  TR.left=st.sec;
  if(st.type==='work'){
    $('#train').classList.remove('rest');
    $('#trEmoji').textContent=st.x.e;$('#trName').textContent=st.x.n;
    TR.cue=0;$('#trSub').textContent=st.x.how[0]||st.x.d;
    beep('go');
  }else{
    $('#train').classList.add('rest');
    const nx=TR.q[TR.i+1];
    $('#trEmoji').textContent='💧';$('#trName').textContent='Dinlen';
    $('#trSub').textContent=nx&&nx.x?('Sırada: '+nx.x.e+' '+nx.x.n):'Son düzlük!';
    beep('rest');
  }
  $('#trRound').textContent=TR.pr.rounds>1?('Tur '+st.round+' / '+TR.pr.rounds):(TR.pr.e+' '+TR.pr.n);
  updProg();
}
function updProg(){
  if(!TR)return;
  const works=TR.q.filter(x=>x.type==='work').length;
  const doneW=TR.q.slice(0,Math.max(0,TR.i+1)).filter(x=>x.type==='work').length;
  $('#trProg').textContent=(TR.phase==='prep'?0:doneW)+' / '+works+' hareket';
  const st=TR.q[TR.i];
  const tot=TR.phase==='prep'?5:(st?st.sec:1);
  $('#trBar').style.width=(100*(1-TR.left/Math.max(tot,1)))+'%';
  $('#trCount').textContent=TR.left;
  $('#trCount').classList.toggle('low',TR.left<=3);
}
function trTick(){
  if(!TR||TR.paused)return;
  TR.left--;
  if(TR.phase!=='prep'){const st=TR.q[TR.i];
    if(st&&st.type==='work'){TR.kcal+=st.kcal/st.sec;TR.sec++}}
  const cst=TR.q[TR.i];
  if(TR.phase!=='prep'&&cst&&cst.type==='work'&&cst.x.how.length>1&&TR.left>0&&(cst.sec-TR.left)%4===0&&(cst.sec-TR.left)>0){
    TR.cue=(TR.cue+1)%cst.x.how.length;
    const el=$('#trSub');el.style.opacity='0';
    setTimeout(()=>{el.textContent=cst.x.how[TR.cue];el.style.opacity='1'},180)}
  if(TR.left<=3&&TR.left>0)beep('tick');
  if(TR.left<=0){
    if(TR.phase==='prep'){TR.phase='run';trStep()}
    else trStep();
  } else updProg();
}
function trDone(){
  if(!TR)return;
  const kc=Math.round(TR.kcal),min=Math.max(1,Math.round(TR.sec/60)),pr=TR.pr;
  clearInterval(TR.timer);TR=null;keepAwake(false);
  $('#train').classList.remove('on','rest');
  S.day.ex=S.day.ex||[];
  S.day.ex.push({id:uid(),n:pr.n+' programı',e:pr.e,min,kcal:kc});
  animate=true;party();chime('win');
  toast(pr.e+' '+pr.n+' bitti! '+min+' dk · '+kc+' kcal 🎉');
  touch();
}
function trQuit(){
  if(!TR)return;
  const kc=Math.round(TR.kcal),min=Math.round(TR.sec/60),pr=TR.pr;
  clearInterval(TR.timer);TR=null;keepAwake(false);
  $('#train').classList.remove('on','rest');
  if(kc>=10){S.day.ex=S.day.ex||[];
    S.day.ex.push({id:uid(),n:pr.n+' (yarım)',e:pr.e,min:Math.max(1,min),kcal:kc});
    toast('Yarıda bıraktın ama '+kc+' kcal yaktın — o da sayılır 💛');animate=true;touch()}
  else{toast('Antrenman kapatıldı');render()}
}

function applyFreeze(){
  const p=S.me;if(!p||!p.lastDone)return;const t=TODAY();
  if(p.lastDone===addDays(t,-2)&&(p.streak||0)>=2&&p.freezeWeek!==weekKey()){
    p.lastDone=addDays(t,-1);p.freezeWeek=weekKey();saveProfile();
    setTimeout(()=>{toast('❄️ Dün kaçtı ama serin donduruldu — haftalık hakkın kullanıldı');render()},1500)}
}
/* hedefe ulaşınca kutlama */
function checkReached(){
  const p=S.me;if(!p)return;const g=calc(p);
  if(g.reached&&!p.celebrated){p.celebrated=true;saveProfile();
    setTimeout(()=>{party();chime('win');
      openSheet(`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:64px;animation:bob 1.6s ease-in-out infinite">🏁</div>
        <h3 style="font-size:24px;margin-top:8px">Hedefine ulaştın, ${esc(p.name)}!</h3>
        <p class="motiv" style="margin:10px 0 16px">${p.startWeight||p.weight} kg'dan ${p.weight} kg'a. Bu, birkaç hafta boyunca her gün küçük bir karar vermek demekti — ve verdin 💛</p>
        <div class="card stack" style="text-align:left">
          <p class="hint" style="font-size:13px">Kalori hedefin artık <b>koruma seviyesine</b> (${nf(g.goal)} kcal) geçti: kilonu korumak için tam yakımın kadar yiyorsun. Seri, görevler ve yarış aynen devam ediyor.</p>
          <p class="hint" style="font-size:13px">Yeni bir hedef koymak istersen Ayarlar → Hedef'ten yapabilirsin; o zaman sayaç sıfırdan başlar.</p>
        </div></div>`)},800)}
}
function ingestJoin(){
  const q=new URLSearchParams(location.search);const ev=(q.get('ev')||'').trim().toUpperCase();
  if(ev&&/^[A-Z0-9]{6,12}$/.test(ev)){const old=LS.get('home');LS.set('home',ev);
    if(old&&old!==ev){LS.set('me',null)}
    try{const u=new URL(location.href);u.searchParams.delete('ev');history.replaceState({},'',u.pathname+(u.search||''))}catch(e){}
    return ev}
  return null;
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S.me&&(S.tab==='home'||S.tab==='set'))render()});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;
async function doInstall(){
  if(installEvt){try{installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;
    if(r&&r.outcome==='accepted'){party();chime('win');toast('📲 Yüklendi! Ana ekranından aç')}render()}catch(e){}}
  else if(isIOS())iosGuide();
  else toast('Tarayıcının menüsünden "Ana ekrana ekle"yi seç');
}
function iosGuide(){
  openSheet(`<h3>📲 iPhone'a kurulum — 2 dokunuş</h3>
    <p class="hint" style="margin:8px 0 16px;font-size:13px">Apple, uygulamaların tek dokunuşla kurulmasına izin vermiyor; ama şu iki adım 10 saniye sürer:</p>
    <div class="card stack">
      <div class="steps-guide">
        <li style="list-style:none;display:grid;grid-template-columns:23px 1fr;gap:10px;font-size:13.5px;line-height:1.5"><b>1</b><span>Ekranın altındaki <b>Paylaş</b> düğmesine dokun ⬆️ (kare içinde yukarı ok)</span></li>
        <li style="list-style:none;display:grid;grid-template-columns:23px 1fr;gap:10px;font-size:13.5px;line-height:1.5"><b>2</b><span>Listede <b>"Ana Ekrana Ekle"</b>ye dokun → <b>Ekle</b></span></li>
      </div>
      <div style="text-align:center;font-size:44px;animation:bob 1.4s ease-in-out infinite">⬇️</div>
      <p class="hint" style="text-align:center">Paylaş düğmesi tam bu okun altında 👇</p>
    </div>
    <p class="hint" style="margin-top:12px">${/CriOS|FxiOS/.test(navigator.userAgent)?'<b>Not:</b> Şu an Chrome/Firefox\'tasın. Bu sayfayı <b>Safari</b>\'de açman gerekiyor — linki Safari\'ye yapıştır.':'Kurulunca tam ekran açılır, tarayıcı çubuğu kaybolur.'}</p>`,true);
}
async function boot(){
  applyTheme(LS.get('theme')||'');
  S.notif=LS.get('notif')||S.notif;
  window.__inj=ingestURL();
  const joined=ingestJoin();
  await initFirebase();
  if(joined)setTimeout(()=>toast('👫 Eve katıldın! Şimdi profilini kur'),800);
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  let list=null;
  if(DB){try{const s=await DB.collection('profiles').get();list=s.docs.map(d=>d.data()).filter(x=>x&&x.id)}catch(e){}}
  if(!list||!list.length)list=LS.get('profiles')||[];
  S.profiles=list;
  const inj=window.__inj;let meId=LS.get('me');
  if(inj&&inj.pid&&list.find(x=>x.id===inj.pid))meId=inj.pid;
  S.me=list.find(x=>x.id===meId)||list[0]||null;
  if(!S.me){showOnboard(true);return}
  LS.set('me',S.me.id);boot2();
}
boot();
window.addEventListener('focus',()=>{if(S.me&&S.day&&S.day.date!==TODAY())location.reload()});
})();
</script>
